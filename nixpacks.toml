[phases.setup]
    # Let Nixpacks automatically detect Laravel, PHP 8.2, and Node.

[phases.release]
    # This runs right before the app starts, ideal for migrations and caching
    cmds = [
        "php artisan config:cache",
        "php artisan route:cache",
        "php artisan view:cache",
        "php artisan migrate --force"
    ]
